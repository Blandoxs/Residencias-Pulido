name: Publicar demostracion

# Copia el contenido de public/ a la rama gh-pages, que es la que sirve
# GitHub Pages. Al no haber un servidor Node detras, la aplicacion arranca
# en modo demostracion (public/js/servidor-demo.js).
#
# Se publica por rama y no con el artefacto de Pages para no depender de que
# el origen de publicacion este configurado como "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-demostracion
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Copiar public/ a la rama gh-pages
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          sitio="$RUNNER_TEMP/sitio"
          mkdir -p "$sitio"
          cp -r public/. "$sitio/"
          touch "$sitio/.nojekyll"

          cd "$sitio"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Demostracion publicada desde ${GITHUB_SHA:0:7}"

          echo "Archivos que se publican:"
          git ls-files

          git push --force --quiet \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages:gh-pages

          echo "Listo: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
