name: Publicar demostracion en GitHub Pages

# Publica el contenido de public/ en la rama gh-pages, que es la que sirve
# GitHub Pages. Al no haber un servidor Node detras, la aplicacion arranca en
# modo demostracion (public/js/servidor-demo.js).
#
# Se usa la rama gh-pages en lugar del artefacto de Pages porque asi no hace
# falta cambiar el origen de publicacion en la configuracion del repositorio.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-demostracion
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Publicar la carpeta public en gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Demostracion publicada desde ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          echo "Demostracion publicada en la rama gh-pages"
